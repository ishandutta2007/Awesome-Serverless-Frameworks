<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="320" viewBox="0 0 1200 320"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d14"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="pulse-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="100%" stop-color="#4facfe" stop-opacity=".2"/></linearGradient><radialGradient id="glow-1" cx="20%" cy="30%" r="40%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><radialGradient id="glow-2" cx="80%" cy="70%" r="45%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".2"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></radialGradient><filter id="neon-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="card-shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="6"/></filter><style>@keyframes pulse{0%{transform:scale(1);opacity:.3}50%{transform:scale(1.15);opacity:.6}}@keyframes drift{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-12px) translateX(8px)}}@keyframes driftSlow{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(14px) translateX(-10px)}}@keyframes shimmer{0%{opacity:.5;filter:drop-shadow(0 0 4px #38bdf8)}50%{opacity:.9;filter:drop-shadow(0 0 12px #ec4899)}}.pulsing-node{animation:pulse 4s ease-in-out infinite alternate}.drifting-fast{animation:drift 8s ease-in-out infinite alternate}.drifting-slow{animation:driftSlow 12s ease-in-out infinite alternate}.dash-flow{stroke-dasharray:8 12;animation:dash 20s linear infinite}.dash-flow-rev{stroke-dasharray:6 10;animation:dashRev 15s linear infinite}.shimmer-bar{animation:shimmer 6s ease-in-out infinite alternate}</style></defs><rect width="100%" height="100%" fill="url(#bg-grad)"/><circle cx="200" cy="80" r="220" fill="url(#glow-1)"/><circle cx="1020" cy="240" r="240" fill="url(#glow-2)"/><g stroke="#334155" stroke-opacity=".15" stroke-width="1"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="200" x2="200" y1="0" y2="320"/><line x1="400" x2="400" y1="0" y2="320"/><line x1="600" x2="600" y1="0" y2="320"/><line x1="800" x2="800" y1="0" y2="320"/><line x1="1000" x2="1000" y1="0" y2="320"/></g><g fill="none" opacity=".45"><path stroke="#38bdf8" stroke-width="2" d="M -50 90 Q 250 140, 500 70 T 950 110 T 1250 80" class="dash-flow"/><path stroke="#818cf8" stroke-width="2" d="M -50 250 Q 280 200, 600 270 T 1000 220 T 1250 260" class="dash-flow-rev"/><path stroke="#ec4899" stroke-opacity=".4" stroke-width="1.5" d="M 100 -20 Q 350 180, 700 130 T 1150 340" class="dash-flow"/></g><g class="drifting-fast" opacity=".35"><circle cx="120" cy="180" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><path fill="#38bdf8" d="M 112 180 L 122 168 L 120 178 L 128 178 L 118 192 L 120 182 Z"/><rect width="85" height="34" x="1040" y="70" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" rx="17"/><text x="1082" y="92" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Edge</text></g><g class="drifting-slow" opacity=".35"><rect width="80" height="30" x="80" y="50" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" rx="15"/><text x="120" y="70" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">λ FaaS</text><rect width="80" height="30" x="1050" y="220" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" rx="15"/><text x="1090" y="240" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🛠️ IaC</text></g><g class="pulsing-node"><circle cx="280" cy="100" r="6" fill="#38bdf8"/><circle cx="920" cy="130" r="6" fill="#ec4899"/><circle cx="600" cy="50" r="5" fill="#818cf8"/></g><g id="foreground" filter="url(#card-shadow)"><rect width="250" height="28" x="475" y="32" fill="#1e293b" stroke="url(#accent-grad)" stroke-width="1.5" rx="14"/><text x="600" y="51" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5" text-anchor="middle">⚡ THE MODERN SERVERLESS STACK</text><text x="600" y="125" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-.5" text-anchor="middle">Awesome Serverless Frameworks</text><text x="600" y="170" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing=".2" text-anchor="middle">Curated Directory of Top SaaS Platforms, Open-Source Runtimes, FaaS &amp; Infrastructure as Code</text><g><g transform="translate(230, 206) translate(0, 0)"><rect width="160" height="36" fill="#111827" stroke="#38bdf8" stroke-width="1.5" rx="18"/><text x="80" y="23" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">🚀 Multi-Cloud</text></g><g transform="translate(230, 206) translate(185, 0)"><rect width="170" height="36" fill="#111827" stroke="#818cf8" stroke-wid